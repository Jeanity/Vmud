<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyGame — Admin</title>
    <style>
      /* The game client's own palette, so the panel reads as kin to the thing it operates. */
      :root {
        color-scheme: dark;
        --ink: #d8d2c4;
        --dim: #8b8172;
        --panel: rgba(18, 20, 17, 0.86);
        --edge: #3a4034;
        --good: #7da87b;
        --warn: #c9a25c;
        --bad: #b06455;
        --accent: #9db08a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0d0a;
        color: var(--ink);
        font-family: 'Iosevka', 'Cascadia Mono', 'Consolas', ui-monospace, monospace;
        font-size: 14px;
      }

      #app {
        height: 100%;
        display: grid;
        grid-template-rows: 42px 1fr;
        grid-template-columns: 170px 1fr;
        grid-template-areas: 'head head' 'nav main';
      }

      /* ------------------------------------------------------------------ header */
      #head {
        grid-area: head;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--edge);
      }
      #head b { letter-spacing: 0.06em; }
      .spacer { flex: 1; }
      #pulse { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; }
      #pulse .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
      #pulse.up .dot { background: var(--good); }

      /* --------------------------------------------------------------------- nav */
      #nav {
        grid-area: nav;
        background: var(--panel);
        border-right: 1px solid var(--edge);
        padding: 10px 0;
        display: flex;
        flex-direction: column;
      }
      #nav a {
        color: var(--dim);
        text-decoration: none;
        padding: 8px 16px;
        border-left: 2px solid transparent;
      }
      #nav a:hover { color: var(--ink); }
      #nav a.active { color: var(--ink); border-left-color: var(--accent); background: rgba(157, 176, 138, 0.06); }
      #nav a .soon { float: right; font-size: 10px; color: var(--dim); opacity: 0.7; }

      /* -------------------------------------------------------------------- main */
      #main { grid-area: main; overflow: auto; padding: 16px; min-width: 0; }
      h2 { margin: 0 0 4px; font-size: 16px; }
      h3 { margin: 18px 0 6px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
      p.note { color: var(--dim); margin: 4px 0 14px; max-width: 72ch; }
      /* A rule that is currently in force and is dangerous — PvP being on. Loud on purpose: an
         operator glancing at this page must be able to tell at a distance. */
      p.note.warn { color: var(--bad); }
      .columns { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(380px, 7fr); gap: 16px; align-items: start; }
      /* The zone browser narrows left to right: which zones, which rooms, which room. Each column
         scrolls on its own, because a zone runs to 219 rooms and the detail must stay in view. */
      /* `auto-fit` rather than three fixed tracks: three columns need ~840px and this panel is
         routinely opened beside the game at 900-ish, where fixed tracks pushed the room detail
         clean off the screen. It wraps to two and then one as the window narrows. */
      .columns3 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 14px;
        align-items: start;
      }
      .columns3 > div > .card { max-height: calc(100vh - 200px); overflow-y: auto; }
      /* Room prose is authored text rather than interface, so it gets room to breathe. */
      p.prose { color: #cfd8c0; line-height: 1.55; margin: 4px 0 0; white-space: pre-wrap; }

      /* ---------------------------------------------------------- the zone map */
      /* Scrolls in both directions rather than scaling to fit: a room cell that shrank with the zone
         would be unclickable on the big ones, and IceCrag is the big one. */
      .zone-map-frame {
        overflow: auto;
        max-height: 46vh;
        margin: 8px 0 4px;
        padding: 6px;
        background: #0d0f0b;
        border: 1px solid var(--edge);
        border-radius: 3px;
      }
      .zone-map { display: block; }
      /* An exit that really does join the neighbouring cell. */
      .zone-map-link { stroke: #6f7a63; stroke-width: 2; }
      /* A way out that leaves this grid — a portal, a staircase, a zone not loaded. Drawn as a stub
         precisely because the map must not claim to know where it lands. */
      .zone-map-stub { stroke: #8b8172; stroke-width: 2; stroke-dasharray: 2 2; }
      .zone-map-vertical { fill: #b9a882; font-size: 9px; pointer-events: none; }
      .zone-map-room { cursor: pointer; }
      .zone-map-room rect { stroke: #22261d; stroke-width: 1; }
      .zone-map-room:hover rect:first-child { stroke: var(--accent); }
      .zone-map-room rect.picked { stroke: var(--accent); stroke-width: 2; }
      .zone-map-room:focus { outline: none; }
      .zone-map-room:focus rect:first-child { stroke: var(--accent); stroke-width: 2; }
      /* A flag changes a rule — `safe`, `no_mob`, `dark` — so a flagged room is findable at a glance. */
      .zone-map-flagged { fill: none; stroke: #c9a25c; stroke-width: 1; stroke-dasharray: 3 2; }
      .zone-map-mob { fill: #e0a86a; }
      .zone-map-player { fill: #8fc3e8; }
      .zone-map-corpse { fill: #b06455; }
      /* A5: somebody has written this room. Same hue as the authored pill, so the map and the table
         say the same thing in the same colour. */
      .zone-map-authored { fill: #cfa8e0; }
      /* Hollow: nobody has written this room. Filled means done, empty means waiting. */
      .zone-map-unwritten { fill: none; stroke: #6a6558; stroke-width: 1; }
      button.on { border-color: var(--accent); color: var(--accent); }

      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--edge); }
      th { color: var(--dim); font-weight: normal; font-size: 12px; }
      tbody tr.pick { cursor: pointer; }
      tbody tr.pick:hover { background: rgba(157, 176, 138, 0.07); }
      tbody tr.picked { background: rgba(157, 176, 138, 0.12); }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 3px;
        padding: 12px 14px;
        margin-bottom: 14px;
      }
      .card h3:first-child { margin-top: 0; }

      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
      .dot.on { background: var(--good); }
      .dot.off { background: var(--dim); opacity: 0.5; }

      .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; }
      .kv dt { color: var(--dim); }
      .kv dd { margin: 0; }

      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
      .row label { color: var(--dim); font-size: 12px; }

      input, select, button, textarea {
        font: inherit;
        color: var(--ink);
        background: #14170f;
        border: 1px solid var(--edge);
        border-radius: 2px;
        padding: 4px 8px;
      }
      input[type='number'] { width: 84px; }
      input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.danger { color: var(--bad); }
      button.danger:hover { border-color: var(--bad); }
      button:disabled { opacity: 0.4; cursor: default; }

      .flash { min-height: 18px; font-size: 12px; margin: 6px 0; }
      .flash.ok { color: var(--good); }
      .flash.err { color: var(--bad); }

      .pill {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        /* Leading margin, not a space in the markup: a pill sits beside a room name and text nodes
           that meet with no gap read as one word — "A Corner in the Guards Walkindoors". */
        margin-left: 6px;
        border: 1px solid var(--edge);
        border-radius: 8px;
        color: var(--dim);
      }
      .pill.live { color: var(--good); border-color: var(--good); }
      .pill.disk { color: var(--warn); border-color: var(--warn); }
      .pill.authored { color: #cfa8e0; border-color: #cfa8e0; }

      /* ---- A5: the prose editor, and the colour it can carry --------------------- */

      .field { display: block; margin: 10px 0; }
      .field > span, .field-label {
        display: block;
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 3px;
      }
      .field-label { margin-top: 10px; }
      .colour-box { display: block; }
      .colour-field { width: 100%; box-sizing: border-box; resize: vertical; }
      textarea.colour-field { font-family: Consolas, monospace; line-height: 1.45; }

      .colour-palette { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 4px; }
      /* Square, unlabelled and the colour itself — the swatch *is* the information, and a row of
         sixteen named buttons would be a wall of text for a choice the eye makes instantly. */
      .swatch {
        width: 20px;
        height: 20px;
        padding: 0;
        border: 1px solid var(--edge);
        border-radius: 2px;
      }
      .swatch:hover { border-color: var(--ink); }
      .swatch.reset, .swatch.strip {
        width: auto;
        padding: 0 7px;
        background: #14170f;
        color: var(--dim);
        font-size: 11px;
      }

      /* The preview is the point of the palette: `&+L` reads as "light" and is near-black, and two
         codes differ by one shift key. Rendered through the client's own parser, on the client's own
         background, so this is what the player sees rather than an impression of it. */
      .colour-preview {
        margin-top: 4px;
        padding: 7px 9px;
        min-height: 20px;
        background: #0d0f0a;
        border: 1px dashed var(--edge);
        border-radius: 2px;
        font-family: Consolas, monospace;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        color: #b8b2a4;
      }

      /* The neighbourhood, above the editor and readable while you type. A room cannot be written
         from its own name — "Southwestern Corner Of the Banquet Hall" does not say whether the hall
         is laid for a feast or in ruins, and the room next door does. */
      .nearby { margin: 10px 0; border: 1px solid var(--edge); border-radius: 3px; padding: 6px 9px; }
      .nearby summary { cursor: pointer; color: var(--dim); font-size: 12px; }
      .near { margin: 8px 0 0; padding-top: 7px; border-top: 1px solid var(--edge); }
      .near:first-of-type { border-top: none; }
      .near-head { font-size: 12px; }
      .near-prose {
        margin-top: 2px;
        font-family: Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        color: #9d9789;
      }

      /* The draft control. Sits above the prose box because that is where its output lands, and the
         eye should travel from the brief downward into the result. */
      .draft {
        margin: 10px 0 4px;
        padding: 8px 10px;
        border: 1px dashed var(--edge);
        border-radius: 3px;
      }
      .draft .row { margin: 4px 0; }
      .draft .brief { width: 100%; box-sizing: border-box; }
      .draft .model { max-width: 200px; }
      .draft .flash { flex: 1; min-width: 0; }

      .flag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 2px 10px; }
      .flagbox { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); }
      .flagbox input { padding: 0; }
      .rig {
        font-size: 11px;
        color: var(--warn);
      }
      .muted { color: var(--dim); }
      /* Items. A search result is a scan target, so the rows are dense and the vnum is a fixed
         column — neighbouring vnums are the same builder's work and the eye follows the number. */
      .controls { display: flex; gap: 8px; margin-bottom: 10px; }
      .controls input[type='search'] { flex: 1; min-width: 0; }
      .rows { max-height: 60vh; overflow-y: auto; }
      .rows .row { gap: 10px; margin: 0; padding: 5px 0; border-bottom: 1px solid var(--edge); }
      .rows .row:last-child { border-bottom: 0; }
      .rows .vnum {
        flex: 0 0 62px;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        font-size: 12px;
      }
      .rows .note { font-size: 12px; }
      .rows .muted { font-size: 11px; margin-left: auto; }
      .rows .row.clickable { cursor: pointer; }
      .rows .row.clickable:hover { background: rgba(157, 176, 138, 0.07); }
      /* The A6 editor, expanded under its row. Labels small and dim, inputs narrow: numbers, not prose. */
      .item-editor { padding: 8px 8px 8px 70px; border-bottom: 1px solid var(--edge); }
      .item-editor label { color: var(--dim); font-size: 11px; text-transform: uppercase; }
      .item-editor input[type='number'] { width: 64px; }
      .item-editor .flash { margin: 0; font-size: 11px; }

      /*
       * A7c — the art picker. `image-rendering: pixelated` is not a preference here: LPC is 64 px
       * art and a browser's default smoothing turns a helmet into a smudge at any scale but 1:1,
       * which would defeat the whole point of showing the picture instead of the id.
       */
      .art-thumb {
        flex: none;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        /* A chequer under the tile, because every one of these sheets is a transparent layer: a
           bare pale glove on the panel's dark background is invisible, and so is a black boot. */
        background-color: rgba(157, 176, 138, 0.06);
        border: 1px solid var(--edge);
        border-radius: 2px;
      }
      .art-picker { flex: 1; min-width: 0; }
      .art-current { display: flex; align-items: center; gap: 8px; }
      .art-name { display: flex; flex-direction: column; font-size: 12px; }
      .art-name .muted { font-size: 10px; }
      .art-browser { margin-top: 6px; padding: 6px; border: 1px solid var(--edge); border-radius: 3px; }
      .art-browser input[type='search'] { flex: 1; min-width: 0; }
      .art-all { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
      /*
       * Auto-fill rather than a fixed count: the browser sits inside an editor that is itself inside
       * a column whose width depends on which panes are open, and a grid pinned to six columns
       * either overflows or wastes half the row.
       */
      .art-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 4px;
        max-height: 40vh;
        overflow-y: auto;
        margin-top: 6px;
      }
      .art-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 3px;
        background: none;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: pointer;
        color: var(--dim);
      }
      .art-tile:hover { border-color: var(--edge); background: rgba(157, 176, 138, 0.07); }
      .art-tile.chosen { border-color: var(--accent); background: rgba(157, 176, 138, 0.14); }
      /* One line, clipped. A three-line label under a 64 px tile makes the grid ragged and unscannable. */
      .art-label {
        max-width: 66px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="head">
        <b>MyGame · admin</b>
        <span id="pulse"><span class="dot"></span><span id="pulse-text">connecting…</span></span>
        <span class="spacer"></span>
        <label class="muted" for="token">token</label>
        <input id="token" type="password" size="12" autocomplete="off" title="x-admin-token — only checked when GAME_ADMIN_TOKEN is set on the server" />
      </header>
      <nav id="nav"></nav>
      <main id="main"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
